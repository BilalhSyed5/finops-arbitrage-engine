# LiteLLM proxy config generated by finops-arbitrage-engine 2026-11-11
# Docs: https://docs.litellm.ai/docs/proxy/configs
#
# How to use: merge into your proxy config, then point each call site at its
# alias, e.g. model="finops-classification". The current model stays as the
# fallback, so a failure on the cheaper model degrades to today's behaviour.
# Routes marked UNVERIFIED have not passed `finops proof`; they are commented
# out until they do.

model_list:
  # classification: gpt-5.5 → gpt-6-luna, saves ~$9,594/mo (VERIFIED by quality proof)
  - model_name: finops-classification
    litellm_params:
      model: "openai/gpt-6-luna"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: finops-classification-fallback
    litellm_params:
      model: "openai/gpt-5.5"
      api_key: os.environ/OPENAI_API_KEY
  # summarization: gpt-4o → gpt-6.1-terra, saves ~$1,498/mo (UNVERIFIED - run `finops proof` first)
#   - model_name: finops-summarization
#     litellm_params:
#       model: "openai/gpt-6.1-terra"
#       api_key: os.environ/OPENAI_API_KEY
#   - model_name: finops-summarization-fallback
#     litellm_params:
#       model: "openai/gpt-4o"
#       api_key: os.environ/OPENAI_API_KEY

  # Model refresh: serve existing model names from their cheaper successors.
  # Uncomment after a regression test; apps need no code change.
  # claude-sonnet-4-5 → claude-sonnet-5-5: ~$2,664/mo
  # - model_name: claude-sonnet-4-5
  #   litellm_params:
  #     model: "anthropic/claude-sonnet-5-5"
  #     api_key: os.environ/ANTHROPIC_API_KEY
  # claude-opus-4-6 → claude-opus-5-5: ~$761/mo
  # - model_name: claude-opus-4-6
  #   litellm_params:
  #     model: "anthropic/claude-opus-5-5"
  #     api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  fallbacks:
    - finops-classification: [finops-classification-fallback]
